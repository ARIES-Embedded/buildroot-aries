# We generate images for the SD card and the SPI-NOR with minimal footprint
# for the bootloaders. A more sophisticated and robust firmware update
# mechanism as per the PSA FW update specification could be selected as well
# but requires changes to the BSP (here and in other places).

image sdcard.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition fsbla {
		image = "%ATFBIN%"
		size = 256K
	}

	partition fip {
		image = "fip.bin"
		size = 4M
	}

	partition u-boot-env {
		# Twice the environment size to allow redundancy
		size = 0x4000
	}

	partition rootfs {
		image = "rootfs.ext4"
		bootable = "yes"
		partition-uuid = b26967be-18fb-40fe-9d9b-ae035fc4a1c5
	}
}

flash nor-16M {
        pebsize = 64K
        numpebs = 256
        minimum-io-unit-size = 1
}

image nor.img {
	flash {
	}
	flashtype = "nor-16M"

	partition fsbla1 {
		image = "%ATFBIN%"
		size = 256K
	}

	partition fsbla2 {
		image = "%ATFBIN%"
		size = 256K
	}

	partition fip {
		image = "fip.bin"
		size = 4M
	}

	# Note that the U-Boot env offset is defined by the U-Boot configs:
	#   CONFIG_ENV_OFFSET=0x900000
	#   CONFIG_ENV_OFFSET_REDUND=0x940000
	# By default we use the env defined by the U-Boot code
}
